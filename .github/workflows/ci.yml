name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"] # Test across multiple versions

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch numpy matplotlib pyyaml pytest tqdm
        pip install ruff mypy
        pip install -e .
        
    - name: Lint with ruff
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        ruff check --select=E9,F63,F7,F82 src/ scripts/

    - name: Type check with mypy
      run: |
        # Check types, but don't fail the build if there are missing stubs
        mypy src/ --ignore-missing-imports || true
        
    - name: Run physics solver tests
      run: |
        pytest tests/ -v