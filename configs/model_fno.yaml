seed: 42
device: cuda

model:
  modes: 16
  width: 64
  n_layers: 4
  in_channels: 3   # V + Re(psi0) + Im(psi0)
  out_channels: 2  # Re(psi_final), Im(psi_final)

training:
  mode: single
  batch_size: 32
  epochs: 200
  lr: 1.0e-3
  weight_decay: 1.0e-5
  norm_penalty: 0.1        # <--- CHANGE THIS FROM 0.0 TO 0.1
  ar_chunk: 4
  eval_every: 20
  grad_clip: 1.0           # <--- Make sure grad_clip is 1.0

data:
  Nx: 256
  t_final: 1.0